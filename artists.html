<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>艺术家索引 · 艺术的故事</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23241812'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23d9bd8c' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>

<header class="wrap" style="padding-top:clamp(40px,6vw,72px);padding-bottom:26px;border-bottom:1px solid var(--line)">
  <p class="eyebrow">Artists</p>
  <h1 style="font-size:clamp(30px,4.6vw,46px);font-weight:400;letter-spacing:.1em;margin:12px 0 10px">艺术家索引</h1>
  <p class="small" style="max-width:42rem">档案包含人物简介、生平时间线、艺术风格、代表作品、重要艺术思想与历史地位。十八位全部开放：从乔托到毕加索，每位含生平时间线、风格分析、代表作品与艺术史地位。</p>
</header>

<main class="wrap" style="padding:clamp(30px,4vw,48px) 24px 90px">
  <div id="artistList"></div>
</main>

<script src="js/data/meta.js"></script>
<script src="js/data/works-more.js"></script>
<script src="js/data/ch01-03.js"></script>
<script src="js/data/ch04-06.js"></script>
<script src="js/data/ch07-09.js"></script>
<script src="js/data/ch10-12.js"></script>
<script src="js/data/ch13-14-17.js"></script>
<script src="js/data/ch18-20.js"></script>
<script src="js/data/ch21-23.js"></script>
<script src="js/data/ch24-26.js"></script>
<script src="js/data/ch27-28.js"></script>
<script src="js/data/artists-more1.js"></script>
<script src="js/data/artists-more2.js"></script>
<script src="js/core.js"></script>
<script>
(function(){
  const {$, esc} = SGA;
  const ready = window.ARTISTS.filter(a=>a.ready);
  const planned = window.ARTISTS.filter(a=>!a.ready);

  const row = a => `
    <a href="artist.html?id=${a.id}" style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:20px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line)">
      <div>
        <div style="font-size:22px;letter-spacing:.05em">${esc(a.n)}</div>
        <div style="font-family:var(--sans);font-size:11px;letter-spacing:.12em;color:var(--ink-faint);margin-top:4px">${esc(a.en)}</div>
      </div>
      <div>
        <div style="font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;color:var(--burgundy);margin-bottom:4px">${esc(a.life)} · 第${a.ch}章</div>
        <div style="font-size:14px;color:var(--ink-soft);line-height:1.8">${esc(a.tag)}</div>
      </div>
      <div style="font-family:var(--sans);font-size:11px;letter-spacing:.16em;color:var(--burgundy)">阅读档案 →</div>
    </a>`;

  const soon = a => `
    <div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(58,38,24,.08);opacity:.55">
      <div>
        <div style="font-size:19px;letter-spacing:.05em">${esc(a.n)}</div>
        <div style="font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;color:var(--ink-faint);margin-top:4px">${esc(a.en)}</div>
      </div>
      <div>
        <div style="font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:4px">${esc(a.life)} · 第${a.ch}章</div>
        <div style="font-size:13.5px;color:var(--ink-soft)">${esc(a.tag)}</div>
      </div>
      <div style="font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint)">撰写中</div>
    </div>`;

  $("#artistList").innerHTML = `
    <p class="eyebrow" style="margin-bottom:8px">已开放 · ${ready.length}</p>
    ${ready.map(row).join("")}
    <p class="eyebrow" style="margin:52px 0 8px">计划中 · ${planned.length}</p>
    ${planned.map(soon).join("")}`;
})();
</script>
</body>
</html>
